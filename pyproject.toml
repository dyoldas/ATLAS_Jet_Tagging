[project]
name = "jet_tagging"
version = "0.1.0"
description = "Jet Tagging with Machine Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.13.0",
    "matplotlib>=3.10.0",
    "numpy<2",
    "pandas>=2.2.3",
    "dacite>=1.9.2",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "simple-parsing>=0.1.7",
    "tables>=3.10.2",
    "torch",
    "torchvision",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jet_tagging"]
